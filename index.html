```html
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071923">
  <title>وش نازل؟</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#071923;
      --panel:#0d2430;
      --panel2:#123541;
      --text:#f7fbff;
      --muted:#9fc1cb;
      --line:rgba(0,217,255,.18);
      --cyan:#00d9ff;
      --gold:#ffd447;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:Tajawal,Arial,sans-serif;
    }

    button{font:inherit}

    .app{
      max-width:900px;
      margin:auto;
      padding:25px 16px 100px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    h1{margin:0;font-size:29px}
    h1 span{color:var(--gold)}

    .download{
      display:none;
      border:1px solid rgba(255,212,71,.4);
      background:var(--panel);
      color:var(--gold);
      border-radius:13px;
      padding:10px 13px;
      cursor:pointer;
    }

    .hero{
      padding:25px;
      border-radius:24px;
      background:linear-gradient(125deg,#00aeca,#07566a,#9d7800);
      margin-bottom:28px;
    }

    .hero h2{font-size:25px;margin:10px 0}
    .hero p{margin:0;color:#e5fbff}

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:25px 0 14px;
    }

    .section-title h2{margin:0}

    .games{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    .game{
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:18px;
      padding:12px;
      color:white;
      cursor:pointer;
      text-align:center;
    }

    .game.active{
      border-color:var(--gold);
      background:var(--panel2);
    }

    .game img{
      width:100%;
      height:80px;
      object-fit:contain;
      border-radius:12px;
    }

    .shop-layout{
      display:grid;
      grid-template-columns:150px 1fr;
      gap:15px;
      direction:ltr;
    }

    .categories{
      direction:rtl;
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .category{
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--muted);
      border-radius:12px;
      padding:10px;
      cursor:pointer;
      text-align:right;
    }

    .category.active{
      background:var(--gold);
      color:#071923;
      border-color:var(--gold);
      font-weight:800;
    }

    .items{
      direction:rtl;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .item{
      overflow:hidden;
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:18px;
      cursor:pointer;
      transition:.2s;
    }

    .item:hover{
      transform:translateY(-4px);
      border-color:var(--cyan);
    }

    .item-img{
      height:190px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#123541,#071923);
      padding:10px;
    }

    .item-img img{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
    }

    .item-info{
      padding:12px;
    }

    .item-info h3{
      margin:0;
      font-size:15px;
    }

    .price{
      color:var(--gold);
      margin-top:7px;
      font-size:13px;
    }

    .loading,
    .error,
    .empty{
      grid-column:1/-1;
      text-align:center;
      padding:40px;
      color:var(--muted);
      background:var(--panel);
      border-radius:18px;
    }

    nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:rgba(5,18,25,.94);
      backdrop-filter:blur(15px);
      border-top:1px solid var(--line);
      display:flex;
      justify-content:center;
      padding:10px;
      z-index:10;
    }

    nav button{
      max-width:180px;
      flex:1;
      background:none;
      border:0;
      color:var(--muted);
      cursor:pointer;
      padding:7px;
    }

    nav button.active{color:var(--gold)}

    .view{display:none}
    .view.active{display:block}

    dialog{
      width:min(92vw,450px);
      border:1px solid var(--line);
      border-radius:22px;
      background:var(--panel);
      color:white;
      padding:0;
    }

    dialog::backdrop{background:rgba(0,0,0,.8)}

    dialog img{
      width:100%;
      height:280px;
      object-fit:contain;
      background:#071923;
    }

    .dialog-body{padding:20px}
    .dialog-body h2{margin:8px 0}

    .close{
      position:absolute;
      top:10px;
      left:10px;
      border:0;
      border-radius:50%;
      width:35px;
      height:35px;
      background:#071923;
      color:white;
      cursor:pointer;
      font-size:22px;
    }

    @media(max-width:650px){
      .games{grid-template-columns:1fr}
      .shop-layout{grid-template-columns:110px 1fr}
      .items{grid-template-columns:repeat(2,1fr)}
      .item-img{height:155px}
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div>
      <small style="color:var(--muted)">كل جديد الألعاب</small>
      <h1>وش نازل؟ <span>✦</span></h1>
    </div>

    <button id="installBtn" class="download">📥 تحميل التطبيق</button>
  </header>

  <section id="home" class="view active">

    <div class="hero">
      <small>آيتم شوب</small>
      <h2>شوف اللي نازل قبل لا يفوتك</h2>
      <p>متاجر الألعاب في مكان واحد وتتحدث تلقائياً.</p>
    </div>

    <div class="section-title">
      <h2>الآيتم شوب</h2>
    </div>

    <div class="games">

      <button class="game active" onclick="selectGame('fortnite')">
        <img src="https://cdn2.unrealengine.com/fortnite-logo-1920x1080-1920x1080-7d4b8f6c8c8e.png" alt="Fortnite">
        <b>Fortnite</b>
      </button>

      <button class="game" onclick="selectGame('rocket')">
        <img src="https://rocketleague.media.zesty.site/rl-logo.png" alt="Rocket League">
        <b>Rocket League</b>
      </button>

      <button class="game" onclick="selectGame('overwatch')">
        <img src="https://d15f34w2p8l1cc.cloudfront.net/hearthstone/overwatch-logo.png" alt="Overwatch">
        <b>Overwatch</b>
      </button>

    </div>

    <div class="section-title">
      <h2 id="homeTitle">Fortnite</h2>
    </div>

    <div class="shop-layout">

      <aside class="categories" id="categories"></aside>

      <section class="items" id="items">
        <div class="loading">جاري تحميل المتجر...</div>
      </section>

    </div>

  </section>

</div>

<nav>
  <button class="active" onclick="goHome()">⌂<br>الرئيسية</button>
  <button onclick="scrollToShop()">▦<br>الآيتم شوب</button>
</nav>

<dialog id="details">

  <button class="close" onclick="details.close()">×</button>

  <img id="detailImage" src="" alt="">

  <div class="dialog-body">
    <small id="detailGame" style="color:var(--muted)"></small>
    <h2 id="detailName"></h2>
    <p id="detailPrice" style="color:var(--gold)"></p>
  </div>

</dialog>

<script>

/* =====================================================
   API KEY
   =====================================================

   إذا كان عندك مفتاح Fortnite API ضعه هنا.
   لا تحط مفتاح شخص آخر.
*/
const FORTNITE_API_KEY = "حط_مفتاحك_هنا";


/* =====================================================
   إعداد الألعاب
===================================================== */

const gameState = {
  fortnite: {
    name:"Fortnite",
    category:"الكل",
    categories:[
      "الكل",
      "الأزياء",
      "الظهر",
      "الفؤوس",
      "الطائرات الشراعية",
      "الرقصات",
      "اللفافات",
      "أخرى"
    ],
    items:[]
  },

  rocket:{
    name:"Rocket League",
    category:"الكل",
    categories:[
      "الكل",
      "السيارات",
      "العجلات",
      "الانفجارات",
      "الملصقات",
      "أخرى"
    ],
    items:[
      {
        name:"Rocket League Item",
        image:"https://rocketleague.media.zesty.site/rl-logo.png",
        price:"متوفر في المتجر"
      }
    ]
  },

  overwatch:{
    name:"Overwatch",
    category:"الكل",
    categories:[
      "الكل",
      "Skins",
      "Emotes",
      "Weapons",
      "Bundles"
    ],
    items:[
      {
        name:"Overwatch Item Shop",
        image:"https://d15f34w2p8l1cc.cloudfront.net/hearthstone/overwatch-logo.png",
        price:"المتجر الحالي"
      }
    ]
  }
};


let currentGame="fortnite";


/* =====================================================
   اختيار اللعبة
===================================================== */

function selectGame(game){

  currentGame=game;

  document.querySelectorAll(".game")
    .forEach((x,i)=>{
      x.classList.toggle(
        "active",
        ["fortnite","rocket","overwatch"][i]===game
      );
    });

  document.getElementById("homeTitle").textContent=
    gameState[game].name;

  renderCategories();

  if(game==="fortnite"){
    loadFortniteShop();
  }else{
    renderItems();
  }

}


/* =====================================================
   الأقسام
===================================================== */

function renderCategories(){

  const box=document.getElementById("categories");

  box.innerHTML=
    gameState[currentGame].categories
    .map(category=>`

      <button
        class="category ${
          gameState[currentGame].category===category
          ? "active"
          : ""
        }"
        onclick="chooseCategory('${category}')">

        ${category}

      </button>

    `)
    .join("");

}


function chooseCategory(category){

  gameState[currentGame].category=category;

  renderCategories();
  renderItems();

}


/* =====================================================
   Fortnite API
===================================================== */

async function loadFortniteShop(){

  const box=document.getElementById("items");

  box.innerHTML=
    `<div class="loading">جاري تحديث متجر Fortnite...</div>`;

  /*
    المصدر الأساسي.
    إذا وضعت API key سيتم إرسال الطلب معه.
  */

  const headers={};

  if(
    FORTNITE_API_KEY &&
    FORTNITE_API_KEY!=="حط_مفتاحك_هنا"
  ){
    headers.Authorization=
      FORTNITE_API_KEY;
  }

  try{

    const response=
      await fetch(
        "https://fortnite-api.com/v2/shop",
        {
          headers
        }
      );

    if(!response.ok){
      throw new Error("API ERROR");
    }

    const data=await response.json();

    const entries=
      data?.data?.entries || [];

    gameState.fortnite.items=
      entries
      .map(entry=>{

        const br=
          entry.brItems?.[0];

        if(!br) return null;

        return {
          name:
            br.name ||
            "Fortnite Item",

          image:
            br.images?.featured ||
            br.images?.icon ||
            br.images?.smallIcon ||
            "",

          price:
            entry.finalPrice
            ? `${entry.finalPrice} V-Bucks`
            : "السعر غير متوفر",

          category:
            getFortniteCategory(br)
        };

      })
      .filter(x=>x && x.image);

    renderItems();

  }catch(error){

    console.error(error);

    box.innerHTML=`

      <div class="error">

        تعذر جلب متجر Fortnite حالياً.

        <br><br>

        تأكد من API key أو جرّب تحديث الصفحة.

        <br><br>

        <button
          onclick="loadFortniteShop()"
          style="
          border:0;
          border-radius:10px;
          padding:9px 15px;
          background:#ffd447;
          color:#071923;
          cursor:pointer;
          font-weight:bold;
          ">
          إعادة المحاولة
        </button>

      </div>

    `;

  }

}


/* =====================================================
   تحديد قسم Fortnite
===================================================== */

function getFortniteCategory(item){

  const type=
    String(
      item.type?.displayValue ||
      item.type?.value ||
      ""
    ).toLowerCase();

  if(type.includes("outfit"))
    return "الأزياء";

  if(type.includes("back"))
    return "الظهر";

  if(type.includes("pickaxe"))
    return "الفؤوس";

  if(type.includes("glider"))
    return "الطائرات الشراعية";

  if(type.includes("emote"))
    return "الرقصات";

  if(type.includes("wrap"))
    return "اللفافات";

  return "أخرى";

}


/* =====================================================
   عرض العناصر
===================================================== */

function renderItems(){

  const box=document.getElementById("items");

  const state=
    gameState[currentGame];

  let items=state.items;

  if(state.category!=="الكل"){

    items=
      items.filter(
        item=>
          item.category===state.category
      );

  }

  if(!items.length){

    box.innerHTML=
      `<div class="empty">
        لا توجد عناصر في هذا القسم حالياً.
      </div>`;

    return;

  }

  box.innerHTML=
    items
    .map(
      (item,index)=>`

        <article
          class="item"
          onclick="showDetails(${index})">

          <div class="item-img">

            <img
              src="${item.image}"
              alt="${escapeHtml(item.name)}"
              loading="lazy"
              onerror="
                this.src='https://via.placeholder.com/400x400/0d2430/ffffff?text=Item'
              "
            >

          </div>

          <div class="item-info">

            <h3>
              ${escapeHtml(item.name)}
            </h3>

            <div class="price">
              ◉ ${escapeHtml(item.price)}
            </div>

          </div>

        </article>

      `
    )
    .join("");

}


/* =====================================================
   التفاصيل
===================================================== */

function showDetails(index){

  const state=
    gameState[currentGame];

  let items=state.items;

  if(state.category!=="الكل"){

    items=
      items.filter(
        item=>
          item.category===state.category
      );

  }

  const item=items[index];

  if(!item) return;

  document.getElementById("detailImage").src=
    item.image;

  document.getElementById("detailGame").textContent=
    state.name;

  document.getElementById("detailName").textContent=
    item.name;

  document.getElementById("detailPrice").textContent=
    item.price;

  document.getElementById("details").showModal();

}


/* =====================================================
   تحميل التطبيق Android
===================================================== */

let deferredPrompt=null;

window.addEventListener(
  "beforeinstallprompt",
  event=>{

    event.preventDefault();

    deferredPrompt=event;

    document.getElementById(
      "installBtn"
    ).style.display="block";

  }
);


document.getElementById("installBtn")
.addEventListener(
  "click",
  async()=>{

    if(!deferredPrompt) return;

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

    deferredPrompt=null;

    document.getElementById(
      "installBtn"
    ).style.display="none";

  }
);


/* =====================================================
   التنقل
===================================================== */

function goHome(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function scrollToShop(){

  document.querySelector(".shop-layout")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   التشغيل
===================================================== */

renderCategories();

loadFortniteShop();

</script>

</body>
</html>
```
