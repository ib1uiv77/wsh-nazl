```html
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071923">
  <meta name="description" content="وش نازل؟ آيتم شوب وأخبار ألعابك في مكان واحد.">
  <title>وش نازل؟</title>

  <link rel="manifest" href="manifest.webmanifest">

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#071923;
      --panel:#0d2430;
      --panel2:#123541;
      --text:#f7fbff;
      --muted:#9fc1cb;
      --line:rgba(0,217,255,.18);
      --cyan:#00d9ff;
      --gold:#ffd447;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:Tajawal,Arial,sans-serif;
      overflow-x:hidden;
    }

    button{
      font:inherit;
    }

    .app{
      max-width:900px;
      margin:auto;
      padding:25px 16px 110px;
    }

    /* =========================
       الهيدر
    ========================= */

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:18px;
    }

    .eyebrow{
      color:var(--muted);
      font-size:12px;
      margin:0 0 3px;
    }

    h1{
      margin:0;
      font-size:29px;
      font-weight:800;
    }

    h1 span{
      color:var(--gold);
    }

    .download{
      display:none;
      border:1px solid rgba(255,212,71,.4);
      background:var(--panel);
      color:var(--gold);
      border-radius:13px;
      padding:10px 13px;
      cursor:pointer;
    }

    /* =========================
       الذكر
    ========================= */

    .dhikr-card{
      display:flex;
      align-items:center;
      gap:12px;
      margin:0 0 22px;
      padding:14px 16px;
      border:1px solid rgba(255,212,71,.18);
      border-radius:18px;
      background:
        linear-gradient(
          135deg,
          rgba(255,212,71,.08),
          rgba(0,217,255,.06)
        );
      box-shadow:0 8px 22px rgba(0,0,0,.18);
    }

    .dhikr-icon{
      width:43px;
      height:43px;
      flex:none;
      display:grid;
      place-items:center;
      border-radius:13px;
      color:var(--gold);
      background:rgba(255,212,71,.1);
      font-size:23px;
    }

    .dhikr-title{
      color:var(--gold);
      font-size:12px;
      margin-bottom:3px;
    }

    .dhikr-text{
      color:var(--text);
      font-size:15px;
      font-weight:700;
      line-height:1.5;
    }

    /* =========================
       الهيرو
    ========================= */

    .hero{
      padding:25px;
      border-radius:24px;
      background:
        linear-gradient(
          125deg,
          #00aeca,
          #07566a,
          #9d7800
        );
      margin-bottom:28px;
      box-shadow:0 12px 30px rgba(0,210,235,.15);
    }

    .hero small{
      color:#e5fbff;
    }

    .hero h2{
      font-size:25px;
      margin:10px 0;
    }

    .hero p{
      margin:0;
      color:#e5fbff;
      line-height:1.6;
    }

    /* =========================
       العناوين
    ========================= */

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:25px 0 14px;
    }

    .section-title h2{
      margin:0;
      font-size:21px;
    }

    .shop-status{
      color:var(--cyan);
      font-size:12px;
    }

    /* =========================
       الألعاب
    ========================= */

    .games{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    .game{
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:18px;
      padding:12px;
      color:white;
      cursor:pointer;
      text-align:center;
      transition:.2s;
    }

    .game:hover{
      transform:translateY(-3px);
      border-color:var(--cyan);
    }

    .game.active{
      border-color:var(--gold);
      background:var(--panel2);
      box-shadow:0 8px 20px rgba(255,212,71,.08);
    }

    .game img{
      width:100%;
      height:80px;
      object-fit:contain;
      border-radius:12px;
      display:block;
      margin-bottom:7px;
    }

    /* =========================
       متجر اللعبة
    ========================= */

    .shop-layout{
      display:grid;
      grid-template-columns:150px minmax(0,1fr);
      gap:15px;
      direction:ltr;
      align-items:start;
    }

    /*
      الأقسام أصبحت Sticky:
      عند النزول تبقى ثابتة بجانب المنتجات.
    */

    .categories{
      direction:rtl;
      display:flex;
      flex-direction:column;
      gap:7px;

      position:sticky;
      top:15px;

      align-self:start;

      max-height:
        calc(100vh - 30px);

      overflow-y:auto;

      scrollbar-width:none;

      z-index:5;
    }

    .categories::-webkit-scrollbar{
      display:none;
    }

    .category{
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--muted);
      border-radius:12px;
      padding:10px;
      cursor:pointer;
      text-align:right;
      transition:.2s;
      flex:none;
    }

    .category:hover{
      border-color:var(--cyan);
      color:white;
    }

    .category.active{
      background:var(--gold);
      color:#071923;
      border-color:var(--gold);
      font-weight:800;
    }

    /* =========================
       المنتجات
    ========================= */

    .items{
      direction:rtl;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      min-width:0;
    }

    .item{
      overflow:hidden;
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:18px;
      cursor:pointer;
      transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s;
    }

    .item:hover{
      transform:translateY(-4px);
      border-color:var(--cyan);
      box-shadow:0 10px 25px rgba(0,0,0,.35);
    }

    .item-img{
      height:190px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
        linear-gradient(
          135deg,
          #123541,
          #071923
        );
      padding:10px;
    }

    .item-img img{
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      object-fit:contain;
      display:block;
    }

    .item-info{
      padding:12px;
    }

    .item-info h3{
      margin:0;
      font-size:15px;
      line-height:1.4;
      min-height:42px;
    }

    .price{
      color:var(--gold);
      margin-top:7px;
      font-size:13px;
      font-weight:700;
    }

    /* =========================
       حالات المتجر
    ========================= */

    .loading,
    .error,
    .empty{
      grid-column:1/-1;
      text-align:center;
      padding:45px 20px;
      color:var(--muted);
      background:var(--panel);
      border-radius:18px;
      border:1px solid var(--line);
    }

    .retry{
      border:0;
      border-radius:10px;
      padding:9px 15px;
      background:var(--gold);
      color:#071923;
      cursor:pointer;
      font-weight:800;
      margin-top:12px;
    }

    /* =========================
       التنقل السفلي
    ========================= */

    nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:rgba(5,18,25,.94);
      backdrop-filter:blur(15px);
      border-top:1px solid var(--line);
      display:flex;
      justify-content:center;
      padding:10px;
      padding-bottom:max(10px,env(safe-area-inset-bottom));
      z-index:20;
    }

    nav button{
      max-width:180px;
      flex:1;
      background:none;
      border:0;
      color:var(--muted);
      cursor:pointer;
      padding:7px;
      transition:.2s;
    }

    nav button:hover{
      color:white;
    }

    nav button.active{
      color:var(--gold);
    }

    /* =========================
       نافذة التفاصيل
    ========================= */

    dialog{
      width:min(92vw,450px);
      border:1px solid var(--line);
      border-radius:22px;
      background:var(--panel);
      color:white;
      padding:0;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(0,0,0,.6);
    }

    dialog::backdrop{
      background:rgba(0,0,0,.8);
      backdrop-filter:blur(4px);
    }

    dialog img{
      width:100%;
      height:280px;
      object-fit:contain;
      background:#071923;
      display:block;
    }

    .dialog-body{
      padding:20px;
    }

    .dialog-body h2{
      margin:8px 0;
    }

    .close{
      position:absolute;
      top:10px;
      left:10px;
      border:0;
      border-radius:50%;
      width:35px;
      height:35px;
      background:#071923;
      color:white;
      cursor:pointer;
      font-size:22px;
      z-index:2;
    }

    /* =========================
       الجوال
    ========================= */

    @media(max-width:700px){

      .app{
        padding:20px 12px 105px;
      }

      header{
        align-items:flex-start;
      }

      h1{
        font-size:25px;
      }

      .download{
        padding:8px 10px;
        font-size:12px;
      }

      .games{
        grid-template-columns:1fr;
      }

      .game{
        display:flex;
        align-items:center;
        gap:12px;
        text-align:right;
      }

      .game img{
        width:65px;
        height:55px;
        margin:0;
        flex:none;
      }

      .shop-layout{
        grid-template-columns:105px minmax(0,1fr);
        gap:10px;
      }

      /*
        على الجوال أيضاً الأقسام تبقى ثابتة.
      */

      .categories{
        top:10px;
        max-height:calc(100vh - 80px);
      }

      .category{
        padding:9px 7px;
        font-size:12px;
      }

      .items{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
      }

      .item-img{
        height:150px;
      }

      .item-info{
        padding:9px;
      }

      .item-info h3{
        font-size:13px;
      }

      .price{
        font-size:11px;
      }

    }

    @media(max-width:430px){

      .shop-layout{
        grid-template-columns:95px minmax(0,1fr);
      }

      .items{
        grid-template-columns:1fr;
      }

      .item-img{
        height:190px;
      }

    }

  </style>
</head>

<body>

<div class="app">

  <!-- =========================

    <div>
      <p class="eyebrow">كل جديد الألعاب</p>

      id="installBtn"

       الذكر

  <div class="dhikr-card">

    <div class="dhikr-icon">
      ۞
    </div>

    <div>

      <div class="dhikr-title">

      </div>

      <div class="dhikr-text">

      </div>

    </div>

  </div>


  <!-- =========================
       الرئيسية
  ========================== -->

  <section id="home">

    <div class="hero">

      <small>آيتم شوب</small>
```
